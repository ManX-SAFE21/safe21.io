<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-k="title">Come funziona BAL PROTOCOL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Colours: the plugin's own (teal, navy, the orange of the offline computer); gold only for the bitcoin. */
/* MASTER FILE. The light-blue copy come-funziona-bal-protocol-celeste.html is generated from this one:
   after every change here run  python make_celeste.py  (see LEGGIMI.md / ANIMATION-LOGIC.md). */
/* Layout: the scene reads top to bottom: the blockchain, the three will-executors in a row, then you (left) and the heirs (right) with their addresses, and time at the bottom. A caption card and the step controls follow. */
:root{
  --bg:#F3F6F6; --panel:#FFFFFF; --ink:#0A0F1C; --muted:#5B6670; --line:#D6DEE1;
  --teal:#0D9488; --teal-2:#14B8A6;
  --srv:#E3F3F0; --srv-line:#0B6B62; --srv-soft:#B8DED8; --led:#14B8A6; --led-off:#EF4444;
  --chain:#0D9488; --chain-line:#9ED8CF; --chain-soft:#E0F2EF;
  --heir:#0B6B62; --ok:#0D9488; --danger:#B42318; --stage:#F2F7F6; --orange:#D97706;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1117; --panel:#121A22; --ink:#E8EEF2; --muted:#9AA8B3; --line:#24313C;
  --stage:#0C1416; --chain:#2DD4BF; --chain-line:#1F5F58; --chain-soft:#0F2A27; --heir:#5EEAD4;
  --srv:#16403B; --srv-line:#5EEAD4; --srv-soft:#2B6B63; --led:#5EEAD4; --ok:#2DD4BF; --danger:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1117; --panel:#121A22; --ink:#E8EEF2; --muted:#9AA8B3; --line:#24313C;
  --stage:#0C1416; --chain:#2DD4BF; --chain-line:#1F5F58; --chain-soft:#0F2A27; --heir:#5EEAD4;
  --srv:#16403B; --srv-line:#5EEAD4; --srv-soft:#2B6B63; --led:#5EEAD4; --ok:#2DD4BF; --danger:#F87171; color-scheme:dark}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1032px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.langs{display:flex;gap:6px;margin:0}
.langs button{font:600 13px var(--body);padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.snd{display:inline-flex;align-items:center;justify-content:center;width:36px;height:31px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.snd[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.sndhint{font:700 18px var(--body);color:#fff;background:var(--teal);padding:7px 14px;border-radius:999px;white-space:nowrap;animation:sndpulse 1.1s ease-in-out infinite}   /* big and coloured: the sound starts only after a tap (owner, 2026-10-20) */
.sndhint[hidden]{display:none}
.snd.wait{animation:sndpulse 1.1s ease-in-out infinite}
@keyframes sndpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--teal) 55%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--teal) 0%,transparent)}}
.snd .mute{display:none}.snd[aria-pressed="false"] .mute{display:inline}.snd[aria-pressed="false"] .wave{display:none}
header p.subtitle{font:600 clamp(19px,2.6vw,24px)/1.25 var(--display);color:var(--ink);margin:8px 0 0}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.qslide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 8%;background:linear-gradient(135deg,#0B6B62 0%,#14B8A6 55%,#7DE3D3 100%);color:#fff;font:600 clamp(22px,4.2vw,44px)/1.25 var(--display);opacity:0;pointer-events:none;transition:opacity .9s ease;text-wrap:balance}
.stage.ask .qslide{opacity:1}
.stage svg{display:block;width:100%;height:auto}
.card{box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:6px;min-height:130px}
.eyebrowrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:2px 38px}   /* title right after "Passo N di M", about 1 cm apart */
.brand{font:600 13px var(--display);color:var(--ok);margin:0;opacity:.85}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600}
.joy .bob{transform-box:fill-box;transform-origin:center;animation:bob 1.1s ease-in-out infinite alternate}.joy .b2{animation-delay:.25s}.joy .b3{animation-delay:.5s}
@keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-5px) scale(1.12)}}
.card h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin:0 0 -10px}   /* tighter space between title and text */
.card p{margin:0;color:var(--muted);font-size:18px}
.card p.note{font-size:14px;margin-top:6px}
.card p.note:empty{display:none}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.btns{display:flex;gap:8px}
.btns button.ctl{width:40px;height:40px;padding:0;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:27px;height:27px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 13px var(--body);cursor:pointer}
.dot[aria-current="step"]{background:var(--teal);border-color:var(--teal);color:#fff}
.dot.done{color:var(--teal);border-color:var(--teal)}
button.ctl{font:600 14px var(--body);padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.ctl.primary{background:var(--teal);border-color:var(--teal);color:#fff}
button:focus-visible{outline:3px solid var(--teal-2);outline-offset:2px}
/* scene */
.lbl{font:600 19px var(--body);fill:var(--ink)}
.sub{font:500 16px var(--body);fill:var(--muted)}
.addr{font:500 15px var(--mono);fill:var(--ink)}
.mv{transition:transform 1.56s cubic-bezier(.45,.05,.2,1),opacity 1.08s ease}
.fade{transition:opacity 1.08s ease}
#heirB,#heirC,#heir3g{transition:opacity 2.6s ease-in-out}   /* the third heir fades in slowly */
#coins3{transition:transform 1.56s cubic-bezier(.45,.05,.2,1),opacity 2.4s ease-in-out}   /* the third coin fades in slowly */
.tip{opacity:0;transition:opacity 1.08s ease}
.bad{opacity:0;transition:opacity 1.08s ease}
.isbad .bad{opacity:1}
svg.tips .tip{opacity:1}
#wifi circle,#wifi path{animation:wf 1.4s ease-in-out infinite}
#wifi path:nth-child(2){animation-delay:.25s}#wifi path:nth-child(1){animation-delay:.5s}
@keyframes wf{0%,100%{opacity:.3}50%{opacity:1}}
#amtBar{transform-box:fill-box;transform-origin:left center;transition:transform 1.5s ease}
.half{transition:transform 1.56s ease,opacity 1.56s ease;transform-box:fill-box;transform-origin:center}
.blk{fill:none;stroke:var(--chain);stroke-width:2}
.blk-n{font:700 12.5px var(--mono);fill:var(--chain)}
.blk-top{fill:var(--chain-line)}
.blk-tx{stroke:var(--chain-line);stroke-width:3;stroke-linecap:round}
.link{fill:none;stroke:var(--chain);stroke-width:2}
.slot{fill:none;stroke:var(--chain);stroke-width:2;stroke-dasharray:6 5}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{opacity:.25}}
.tx{fill:none;stroke:var(--chain);stroke-width:3;stroke-dasharray:8 7}
.beat path{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.6s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
/* step 1: a will written once with a quill on your screen (6 s, restarted when step 1 is shown) */
.ink{fill:none;stroke:#1F2A44;stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
#w1{animation:w1 6s linear forwards}#w2{animation:w2 6s linear forwards}#w3{animation:w3 6s linear forwards}
#w4{animation:w4 6s linear forwards}#w5{animation:w5 6s linear forwards}
@keyframes w1{0%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
@keyframes w2{0%,18%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}
@keyframes w3{0%,36%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
@keyframes w4{0%,54%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
@keyframes w5{0%,72%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
#quill{animation:quill 6s linear forwards}
@keyframes quill{
  0%{transform:translate(70px,333px)}16%{transform:translate(140px,333px)}
  18%{transform:translate(70px,345px)}34%{transform:translate(132px,345px)}
  36%{transform:translate(70px,357px)}52%{transform:translate(138px,357px)}
  54%{transform:translate(70px,369px)}70%{transform:translate(118px,369px)}
  72%{transform:translate(104px,383px)}88%,100%{transform:translate(142px,380px)}}
@media (max-width:560px){.card h2{font-size:20px}.card p{font-size:16px}.dot{width:26px;height:26px}}
/* phones (owner, 2026-10-25): narrower side margins (a larger drawing), the language / sound row wraps */
@media (max-width:560px){body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}.right{flex-wrap:wrap;margin-left:0}.sndhint{font-size:15px;padding:5px 11px}}
.tapstart{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:0;padding:0;margin:0;cursor:pointer;background:color-mix(in srgb,var(--stage) 62%,transparent);color:var(--ink);font:700 clamp(18px,3.2vw,30px)/1.1 var(--display)}
.tapstart small{font:600 clamp(13px,1.8vw,17px) var(--body);color:var(--muted)}
.tapstart .pl{width:clamp(62px,11vw,108px);aspect-ratio:1;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:sndpulse 1.4s ease-in-out infinite}
.tapstart .pl svg{width:44%;height:44%;margin-left:9%}
</style>

<div class="wrap">
  <div class="stage">
    <button class="tapstart" id="tapStart" type="button" onclick="this.remove();document.getElementById('restart').click()"><span class="pl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l15 9-15 9z" fill="#fff"/></svg></span><span id="tapT">Tocca per iniziare</span><small id="tapS">con la voce</small></button>
    <script>(function(){document.addEventListener("pointerdown",function(e){var b=document.getElementById("tapStart");if(b&&!b.contains(e.target))b.remove()},{once:true})})()</script>
    <svg viewBox="0 0 1030 516" role="img" aria-labelledby="scene-t scene-d">
      <title id="scene-t" data-k="sceneT">La blockchain, tre will-executor, il tuo indirizzo e quello degli eredi</title>
      <desc id="scene-d" data-k="sceneD">Le copie firmate del testamento vanno dal tuo computer ai tre will-executor. Alla data di consegna tutti e tre inviano la loro copia: il nuovo blocco ne accetta una sola, le altre due vengono scartate, e i bitcoin passano dal tuo indirizzo a quello degli eredi.</desc>
      <defs>
        <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19B8A6"/><stop offset="1" stop-color="#19B8A6"/></linearGradient>
        <linearGradient id="gRack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rack-2)"/><stop offset="1" style="stop-color:var(--rack)"/></linearGradient>
        <linearGradient id="gEnv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4DC"/><stop offset="1" stop-color="#FFF4DC"/></linearGradient>
        <radialGradient id="gCoin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF4DC"/><stop offset="1" stop-color="#FFF4DC"/></radialGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0A0F1C" flood-opacity="0"/></filter>
        <marker id="arrowTx" viewBox="0 0 16 16" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M1 1 L14 8 L1 15 Z" fill="var(--chain)"/></marker>
        <symbol id="env" viewBox="0 0 48 34">
          <rect x="1" y="1" width="46" height="32" rx="3" fill="url(#gEnv)" stroke="#D97706" stroke-width="1.8"/>
          <path d="M2 2 L24 18 L46 2" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="24" cy="21" r="3.2" fill="#D97706"/>
        </symbol>
        <symbol id="person" viewBox="0 0 40 60">
          <circle cx="20" cy="13" r="10" fill="currentColor"/>
          <path d="M3 58 C3 38 12 30 20 30 C28 30 37 38 37 58 Z" fill="currentColor"/>
        </symbol>
      </defs>

      <!-- the blockchain: blocks linked in a chain; the last place is the next block -->
      <g id="chain" class="mv"></g>
      <line x1="700" x2="700" y1="8" y2="92" stroke="var(--chain)" stroke-width="2"/>
      <g id="newblock" class="fade" opacity="0" transform="translate(-170,0)">
        <rect x="882" y="20" width="60" height="60" fill="var(--panel)" stroke="var(--chain)" stroke-width="4"/>
        <text id="nbNum" class="blk-n" x="912" y="45" text-anchor="middle">868180</text>
        <circle cx="912" cy="62" r="7" fill="var(--orange)"/>
        <circle cx="940" cy="22" r="13" fill="var(--ok)"/><path d="M933 22 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="20" y="110" style="font:700 17px var(--body);fill:var(--chain)" data-k="chain">Blockchain di Bitcoin</text>
      
      <text id="nbTag" class="fade" x="742" y="95" text-anchor="middle" opacity="0" style="font:700 14px var(--body);fill:var(--ok)" data-k="accepted">accettata</text>

      <!-- the three will-executors, in a row -->
      <!-- separators between the actors: me | will-executors | heirs -->
      <line x1="270" x2="270" y1="104" y2="400" stroke="var(--chain)" stroke-width="2"/>
      <line x1="754" x2="754" y1="104" y2="400" stroke="var(--chain)" stroke-width="2"/>
      <g id="racks"></g>
      <text id="offTag1" class="fade" x="356" y="249" text-anchor="end" opacity="0" style="font:700 16px var(--body);fill:var(--danger)" data-k="off">spento</text>
      <text id="offTag" class="fade" x="356" y="159" text-anchor="end" opacity="0" style="font:700 16px var(--body);fill:var(--danger)" data-k="off">spento</text>
      <g id="rejTag" class="fade" opacity="0">
        <text x="745" y="198" text-anchor="end" style="font:700 18px var(--body);fill:var(--danger)" data-k="refused">copie scartate</text>
        <text class="sub" x="745" y="217" text-anchor="end" data-k="spent">quei bitcoin sono già spesi</text>
      </g>

      <g transform="translate(0,-140)">
      <!-- timeline -->
      <g>
        <line x1="60" y1="606" x2="990" y2="606" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
        <line x1="96" y1="600" x2="96" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="0" x="96" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <line x1="216" y1="600" x2="216" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="1" x="216" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <line x1="336" y1="600" x2="336" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="2" x="336" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <line x1="456" y1="600" x2="456" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="3" x="456" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <line x1="576" y1="600" x2="576" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="4" x="576" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <line x1="696" y1="600" x2="696" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="5" x="696" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <line x1="816" y1="600" x2="816" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="6" x="816" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <line x1="936" y1="600" x2="936" y2="612" stroke="var(--muted)" stroke-width="1.5"/><text class="yr" data-i="7" x="936" y="634" text-anchor="middle" style="font:600 14px var(--body);fill:var(--muted)"></text>
        <g id="today" class="mv">
          <circle cx="0" cy="606" r="10" fill="var(--teal)"/><circle cx="0" cy="606" r="16" fill="none" stroke="var(--teal)" stroke-width="2" opacity=".35"/>
          <text id="todayLbl" class="sub fade" x="-16" y="594" text-anchor="end" data-k="today">oggi</text>
        </g>
        <g id="due" class="mv">
          <g filter="url(#sh)">
            <rect x="-24" y="556" width="48" height="42" rx="4" fill="var(--panel)" stroke="var(--line)"/>
            <rect x="-24" y="556" width="48" height="13" rx="4" fill="var(--orange)"/><rect x="-24" y="563" width="48" height="6" fill="var(--orange)"/>
          </g>
          <text id="dueText" x="0" y="591" text-anchor="middle" style="font:700 17px var(--display);fill:var(--ink)"></text>
          <text class="sub" x="-32" y="588" text-anchor="end" data-k="delivery">consegna</text>
          <g id="dueX" class="fade" opacity="0"><path d="M-21 559 L21 595 M21 559 L-21 595" stroke="#C62828" stroke-width="5" stroke-linecap="round"/></g>
        </g>
      </g>

      <!-- the transaction: from your address to the heirs' address -->
      <path id="tx" class="tx fade" opacity="0" d="M226 512 C 430 556, 590 540, 796 465" marker-end="url(#arrowTx)"/>

      <!-- you: the wallet with the keys, and your address -->
      <g filter="url(#sh)">
        <rect x="31" y="291" width="170" height="110" rx="5" fill="var(--panel)" stroke="var(--srv-line)" stroke-width="2.5"/>
        <rect x="40" y="300" width="152" height="92" rx="2" fill="url(#gScreen)"/>
        <path d="M116 402 V420" stroke="var(--srv-line)" stroke-width="2.5"/>
        <path d="M80 421 H152" stroke="var(--srv-line)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g id="beat" class="beat fade" opacity="0">
        <path d="M50 346 H90 L100 326 L112 368 L124 334 L132 346 H182" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        <text x="116" y="384" text-anchor="middle" style="font:700 13px var(--body);fill:#fff" data-k="alive">ci sei</text>
      </g>
      <!-- step 1: the will written on your screen, with a quill -->
      <g id="write" class="fade" opacity="0">
        <rect x="62" y="303" width="88" height="88" rx="3" fill="#FFFBF0" stroke="#E6D8B8"/>
        <text x="106" y="320" text-anchor="middle" style="font:italic 600 11px Georgia, 'Times New Roman', serif;fill:#1F2A44" data-k="sheet">Testamento</text>
        <path id="w1" class="ink" pathLength="1" d="M70 333 H140"/>
        <path id="w2" class="ink" pathLength="1" d="M70 345 H132"/>
        <path id="w3" class="ink" pathLength="1" d="M70 357 H138"/>
        <path id="w4" class="ink" pathLength="1" d="M70 369 H118"/>
        <path id="w5" class="ink" pathLength="1" d="M104 383 C110 374 114 390 120 380 C125 372 130 388 136 379 L142 380"/>
        <g id="quill">
          <path d="M0 0 L26 -36" stroke="#5B4636" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M6 -8 C10 -26 24 -44 40 -54 C36 -38 26 -20 10 -6 Z" fill="#FFFFFF" stroke="#8A7A66" stroke-width="1"/>
          <path d="M9 -10 C16 -24 26 -36 36 -48" fill="none" stroke="#C9BBA6" stroke-width="1"/>
        </g>
      </g>
      <g id="wifi" class="fade">
        <path d="M89 342 Q116 316 143 342" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <path d="M100 354 Q116 340 132 354" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="116" cy="366" r="6" fill="#fff"/>

    // the delivery is done: the old, invalidated copies go away
    later(()=>{for(let k=0;k<3;k++)for(let i=0;i<3;i++)op(E(k,i),0)},gone);
  }
  $("qslide").parentNode.classList.toggle("ask",n===13);
  voiceStart(n);
  if(n===14){
    // two of the three will-executors are off: the one that is left is enough
    const off=()=>[0,1].forEach(r=>{op("rack"+r,.35);op(r?"offTag1":"offTag",1);$("rack"+r).querySelectorAll(".led").forEach(l=>l.setAttribute("fill","var(--led-off)"));
      op(E(3,r),.25)});if(VT)later(off,VX(3000,3340,2890));else off();
    snd("powerdown",VT?VX(3000,3340,2890):200);
    if(VT)later(()=>deliver([2]),VX(6940,7670,7840));else deliver([2]);
  }
  $("eyebrow").textContent=T("stepOf").replace("{n}",n+1).replace("{m}",STEPS.length);
  $("cap-t").textContent=STEPS[n][0];$("cap-d").textContent=STEPS[n][1];
  $("cap-n").textContent=STEPS[n][2]||"";
  for(let i=0;i<STEPS.length;i++){const d=$("dot"+i);d.classList.toggle("done",i<n);
    if(i===n)d.setAttribute("aria-current","step");else d.removeAttribute("aria-current")}
}
const lbl=k=>T(k).replace(/^[^\p{L}]+/u,"");
function setPlay(on){$("play").textContent=on?"❚❚":"▶";$("play").title=lbl(on?"pause":"play");$("play").setAttribute("aria-label",lbl(on?"pause":"play"))}
function stop(){clearTimeout(timer);timer=null;setPlay(false);voiceStop()}
$("next").onclick=()=>{stop();show((step+1)%STEPS.length)};
$("prev").onclick=()=>{stop();show((step+STEPS.length-1)%STEPS.length)};
// time on each step: attentive reading (about 3 words a second, note included) plus 2.5 s to see the drawing; never under 9 s (the longest animation), the question slide 6 s
// PACE: owner decision 2026-10-19, all the times halved (1 = the reading times above)
const PACE=.5;
const dwell=n=>Math.round(PACE*Math.max(n===13?6000:9000,Math.round((STEPS[n][0]+" "+STEPS[n][1]+" "+(STEPS[n][2]||"")).split(/\s+/).length/3*1000)+2500));
// voice version: a narrated step lasts its clip plus VO_GAP; otherwise the reading time above
const dwellV=n=>voiceOn()?Math.round(VO_LEN[LANG][n]*1000)+VO_GAP:dwell(n);
function auto(){timer=setTimeout(()=>{if(step===STEPS.length-1){stop();return}show(step+1);auto()},dwellV(step))}
$("play").onclick=()=>{if(timer){stop();return}setPlay(true);show(step);auto()};
$("restart").onclick=()=>{stop();setPlay(true);show(0);auto()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});
function applyLang(l){
  // every text of the page and of the drawing in the chosen language; the step shown is drawn again
  LANG=l;STEPS=STEPS_L[l];document.documentElement.lang=l;document.title=T("title");
  document.querySelectorAll("[data-k]").forEach(e=>{e.textContent=T(e.dataset.k)});
  // short notes inside the drawing are broken into lines of at most N characters
  document.querySelectorAll("[data-wrap]").forEach(e=>{
    const x=e.getAttribute("x"),max=+e.dataset.wrap,lines=[];let cur="";
    e.textContent.split(" ").forEach(w=>{if(cur&&(cur+" "+w).length>max){lines.push(cur);cur=w}else cur=cur?cur+" "+w:w});
    lines.push(cur);e.textContent="";
    lines.forEach((l,i)=>{const t=document.createElementNS(NS,"tspan");t.setAttribute("x",x);t.setAttribute("dy",i?"16":"0");t.textContent=l;e.appendChild(t)})});
  document.querySelectorAll("[data-t]").forEach(e=>{const t=T(e.dataset.t).replace(/^[^\p{L}]+/u,"");e.title=t;e.setAttribute("aria-label",t)});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  STEPS.forEach((st,i)=>$("dot"+i).setAttribute("aria-label",(i+1)+". "+st[0]));
  try{localStorage.setItem("bal-explainer-lang",l)}catch(e){}
  stop();show(step);
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>applyLang(b.dataset.lang));
// sound button: on / off, remembered in the browser
function setSound(on){soundOn=on;$("snd").setAttribute("aria-pressed",on);try{localStorage.setItem("bal-explainer-sound",on?"1":"0")}catch(e){}
  if(on)audio();else{voiceStop();musicStop();if(AC)AC.suspend().catch(()=>{})}sndHint()}
    function setMusic(on){musicOn=on;$("mus").setAttribute("aria-pressed",on);try{localStorage.setItem("bal-explainer-music",on?"1":"0")}catch(e){}
      if(on){audio();musicStart()}else musicStop()}
    $("mus").setAttribute("aria-pressed",musicOn);
    $("mus").onclick=()=>setMusic(!musicOn);
$("snd").setAttribute("aria-pressed",soundOn);sndHint();
$("snd").onclick=()=>setSound(!soundOn);
applyLang(LANG);
// the text card keeps the height of its tallest step (in every language), so the controls below never move
function fitCard(){
  const card=document.querySelector(".card"),ids=["cap-t","cap-d","cap-n"];
  const keep=ids.map(id=>$(id).textContent);
  card.style.minHeight="";
  let max=0;
  Object.values(STEPS_L).forEach(L=>L.forEach(st=>{
    ids.forEach((id,i)=>{$(id).textContent=st[i]||""});
    max=Math.max(max,card.offsetHeight)}));
  ids.forEach((id,i)=>{$(id).textContent=keep[i]});
  card.style.minHeight=max+"px";
}
fitCard();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitCard);
let fitT;window.addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(fitCard,150)});
// the animation starts by itself, as if play had been pressed (not when the viewer asked the system for reduced motion)
{setPlay(true);auto()}   // always plays, also with "reduce motion" on (owner, 2026-10-23/25: phones)
})();
</script>
